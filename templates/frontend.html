<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women Safety Complaint Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom right, #ffdde1, #ee9ca7);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: center;
            background: linear-gradient(to right, #d72c6c, #9b1b5c);
            padding: 20px 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            display: inline-block;
        }

        nav ul li a {
            display: block;
            background: white;
            color: #9b1b5c;
            font-weight: 600;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 12px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        nav ul li a:hover {
            background: #9b1b5c;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="{{ url_for('home_page') }}">Home</a></li>
                <li><a href="{{ url_for('map_page') }}">Map</a></li>
                <li><a href="{{ url_for('alert_page') }}">Alert</a></li>
                <li><a href="{{ url_for('contact_page') }}">Contact Us</a></li>
                <li><a href="{{ url_for('report_page') }}">Report Incident</a></li>
            </ul>
        </nav>
    </header>

    <script>
        document.getElementById('complaintForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const problemType = document.getElementById('problemType').value;
            const severity = document.getElementById('severity').value;
            const description = document.getElementById('description').value;
            const location = document.getElementById('location').value;
            
            fetch('/submit', {  // Changed to relative URL
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ problemType, severity, description, location })
            })
            .then(response => response.json())
            .then(data => {
                displayAlert(data.message);
                loadChart();
            })
            .catch(() => displayAlert("Error submitting complaint. Please try again.", 'error'));
        });

        function loadChart() {
            fetch('/chart-data')  // Changed to relative URL
            .then(response => response.json())
            .then(data => {
                new Chart(document.getElementById('priorityChart').getContext('2d'), {
                    type: 'bar',
                    data: { labels: data.labels, datasets: [{ label: 'Red Points', data: data.data, backgroundColor: '#d72c6c' }] },
                });
            });
        }

        function loadRedZones() {
            fetch('/red-zones')  // Changed to relative URL
                .then(response => response.json())
                .then(redZones => {
                    const tableBody = document.querySelector('#red-zones-table tbody');
                    tableBody.innerHTML = '';
                    redZones.forEach(zone => {
                        const row = tableBody.insertRow();
                        const locationCell = row.insertCell();
                        const priorityCell = row.insertCell();
                        const countCell = row.insertCell();
                        locationCell.textContent = zone.location;
                        priorityCell.textContent = zone.priority;
                        countCell.textContent = zone.count;
                    });
                });
        }

        loadChart();
        loadRedZones();
        setInterval(loadRedZones, 5000);
    </script>
</body>
</html>
